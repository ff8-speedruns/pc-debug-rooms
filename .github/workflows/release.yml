name: Build and release

on:
  push:
    tags: ["v*"]        # git tag v1.0.0 && git push origin v1.0.0  -> builds + publishes a release
  workflow_dispatch:    # manual run from the Actions tab -> builds, exe downloadable as an artifact

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build exe
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name FF8DebugRooms --add-data "maplist;." debug_room_app.py

      - uses: actions/upload-artifact@v4
        with:
          name: FF8DebugRooms
          path: dist/FF8DebugRooms.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FF8DebugRooms.exe
          generate_release_notes: true
